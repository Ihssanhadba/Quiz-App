<div class="m-5 my-3">
    <div class="container gap-2 d-flex flex-column justify-content-center text-center ">
        <h1>Welcome to the Quiz App!</h1>
        <h4 class="text-secondary">Test your knowledge and have fun!</h4>
    </div>
    <div *ngIf="allQuizCategories.length>0" class=" border rounded p-3 mt-2">
        <h2 class="text-center col-md-12">Available Quizzes</h2>
        <div class="row mt-4">
            <div class="col-md-4 mb-5" *ngFor="let quizCategory of allQuizCategories">
                <div class="card h-100">
                    <img [src]=quizCategory.imageUrl class="card-img-top" (click)="GoToQuiz(quizCategory.category)">
                    <div class="card-body border">
                        <h5 class="card-title" (click)="GoToQuiz(quizCategory.category)">{{quizCategory.title}}</h5>
                        <p class="card-text">{{quizCategory.description}}</p>
                    </div>
                </div>
            </div>
        </div><button routerLink="/quiz" class="btn btn-primary w-100 btn-lg">Start Quiz</button>
    </div>
</div>
<footer *ngIf="allQuizCategories.length>0" class="bg-dark text-white text-center p-3 mt-5">
    <p>&copy; 2024 Quiz App - All Rights Reserved</p>
</footer>
